spring.config.import=optional:file:.env[.properties]

spring.application.name=repairlink-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/repairlink_dev
spring.datasource.username=repairlink_app
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB
app.upload.dir=uploads/service-requests